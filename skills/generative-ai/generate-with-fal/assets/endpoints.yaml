        seed: "integer — seed for reproducibility (default: random)"
        acceleration: "enum: none | regular | high (default: regular)"
        enable_prompt_expansion: "boolean — expand the prompt for better results (default: false)"
        enable_safety_checker: "boolean — enable the safety checker (default: true)"
