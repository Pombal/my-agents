      required: ["prompt"]
      batch: null
      params:
        prompt: "string — style description; used to derive tags and lyrics"
        duration: "number — length in seconds (range: 5-240; default: 60)"
        instrumental: "boolean — instrumental version (default: false)"
        number_of_steps: "integer — inference steps (range: 3-60; default: 27)"
        guidance_scale: "number — CFG scale (range: 0-200; default: 15)"
        seed: "integer — seed (default: random)"

