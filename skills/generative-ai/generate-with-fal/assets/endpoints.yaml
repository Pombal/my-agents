        image_size: "string preset or {width,height} — square_hd | square | portrait_4_3 | portrait_16_9 | landscape_4_3 | landscape_16_9 (default: input size)"
        output_format: "enum: jpeg | png | webp (default: png)"
        negative_prompt: "string — content to avoid (maximum: 500 characters; default: empty)"
        enable_prompt_expansion: "boolean — expand the prompt for better results (default: true)"
        enable_safety_checker: "boolean — enable the safety checker (default: true)"

  - id: "xai/grok-imagine-image/edit"
    aliases: ["grok edit", "grok imagine edit", "grok image edit", "xai grok edit"]
    category: "image-to-image"
    description: "Edit images with xAI's Grok model. Supports up to 3 reference images and long prompts."
    notes: "Up to 8000 char prompts. Up to 3 input images. Input images are optional in the old tool; supports 1-4 outputs."
    input:
      required: ["prompt"]
      batch: "num_images"
      params:
        prompt: "string — edit instruction (maximum: 8000 characters)"
        image_urls: "string[] — optional source/reference image URLs or local paths (maximum: 3)"
        num_images: "integer — number of images to generate (range: 1-4; default: 1)"
        output_format: "enum: jpeg | png | webp (default: jpeg)"

  - id: "fal-ai/bytedance/seedream/v4.5/edit"
    aliases: ["seedream edit", "seedream v4.5 edit", "seedream", "bytedance edit"]
    category: "image-to-image"
    description: "ByteDance Seedream V4.5 for high-quality intelligent image editing with multiple inputs."
    notes: "Up to 10 input images. Supports auto_2K and auto_4K sizes. Custom width and height must each be 1920-4096, or total dimensions between 2560x1440 and 4096x4096; up to 6 separate generations and 6 images per generation."
    input:
      required: ["prompt", "image_urls"]
      batch: "num_images"
