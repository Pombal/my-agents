  - id: "fal-ai/elevenlabs/sound-effects/v2"
    aliases: ["elevenlabs sound effects", "elevenlabs sfx", "eleven sfx", "sound effects v2"]
    category: "text-to-audio"
    description: "ElevenLabs Sound Effects v2: text-to-sound-effect generation, with optional seamless looping."
    notes: "$0.002 per second of output (a 2 s sound costs $0.004; the 22 s maximum costs $0.044). Leave duration_seconds unset to let the model pick from the prompt. loop=true makes ambience and loops repeat seamlessly. Output is one audio file (MP3 by default)."
    input:
      required: ["text"]
      batch: null
      params:
        text: "string — description of the sound effect to generate"
        duration_seconds: "number — length in seconds (range: 0.5-22; default: chosen from the prompt)"
        prompt_influence: "number — how closely to follow the prompt; higher means less variation (range: 0-1; default: 0.3)"
        loop: "boolean — make a sound that loops smoothly (default: false)"
        output_format: "enum: mp3_22050_32 | mp3_44100_32 | mp3_44100_64 | mp3_44100_96 | mp3_44100_128 | mp3_44100_192 | pcm_8000 | pcm_16000 | pcm_22050 | pcm_24000 | pcm_44100 | pcm_48000 | ulaw_8000 | alaw_8000 | opus_48000_32 | opus_48000_64 | opus_48000_96 | opus_48000_128 | opus_48000_192 (default: mp3_44100_128)"

  - id: "cassetteai/music-generator"
    aliases: ["cassetteai", "cassette music"]
    category: "text-to-music"
    description: "CassetteAI music generator: text-to-music tracks of 10-180 s, 44.1 kHz stereo WAV."
    notes: "$0.02 per output minute (a 30 s loop costs $0.01; 3 min costs $0.06). Fast: about 2 s for 30 s of audio. Put genre, instruments, mood, key, and tempo (BPM) in the prompt. No loop or vocals parameters; loops need trimming or crossfading in post."
    input:
      required: ["prompt", "duration"]
      batch: null
      params:
        prompt: "string — music description; include genre, instruments, mood, key, and tempo (e.g. 'Key: D Minor, Tempo: 90 BPM')"
        duration: "integer — length in seconds (range: 10-180)"

  - id: "cassetteai/sound-effects-generator"
    aliases: ["cassetteai sfx", "cassette sound effects"]
    category: "text-to-audio"
    description: "CassetteAI sound-effects generator: text-to-SFX clips of 1-30 s."
    notes: "$0.01 per generation, flat, regardless of length. Only prompt and integer duration; no seed or loop."
    input:
      required: ["prompt", "duration"]
      batch: null
      params:
        prompt: "string — description of the sound effect"
        duration: "integer — length in seconds (range: 1-30)"

