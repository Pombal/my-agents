        target_resolution: "enum: 720p | 1080p | 1440p | 2160p — used in target mode (default: 1080p)"
        seed: "integer — random seed for reproducibility (default: random)"
        noise_scale: "number — generation noise scale (range: 0-1; default: 0.1)"
        output_format: "enum: png | jpg | webp (default: jpg)"

  - id: "meta/muse-image/text-to-image"
    aliases: ["muse", "muse image", "meta muse"]
