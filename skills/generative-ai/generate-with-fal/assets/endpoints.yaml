      required: ["prompt"]
      batch: null
      params:
        prompt: "string — description of the sound"
        duration: "number — length in seconds (range: 0.5-180; default: 8)"
        audio_format: "enum: wav | mp3 | aac | flac (default: aac)"

  - id: "mirelo-ai/sfx1.6/text-to-audio"
    aliases: ["mirelo sfx", "mirelo", "mirelo 1.6"]
    category: "text-to-audio"
    description: "Mirelo SFX 1.6 text-to-audio, with a dedicated seamless-loop ambience mode."
    notes: "$0.01 per second of output, apparently billed per sample, so keep num_samples at 1 (the runner pins it). ambience=true makes a seamlessly loopable tile (min 1 s); double_output concatenates it to 2x length."
    input:
      required: ["text_prompt"]
      batch: "num_samples"
      params:
        text_prompt: "string — description of the sound"
        duration: "number — length in seconds (range: 0.1-60, min 1 with ambience; default: 10)"
        ambience: "boolean — generate a seamlessly loopable ambience tile (default: false)"
        double_output: "boolean — with ambience, concatenate the loop with itself (default: false)"
        num_samples: "integer — variations per request (range: 1-4; default: 2)"
        seed: "integer — seed; -1 or unset for random"
        upload_audio_format: "enum: wav | mp3 | aac | flac (default: wav)"

  - id: "fal-ai/elevenlabs/music"
    aliases: ["elevenlabs music", "eleven music"]
    category: "text-to-music"
    description: "ElevenLabs Music: text-to-music up to 10 minutes, optional composition plan, guaranteed-instrumental flag."
    notes: "$0.60 per output minute, rounded UP to whole minutes (a 30 s track bills as 1 minute, $0.60). Length 3-600 s via music_length_ms."
    input:
      required: ["prompt"]
      batch: null
      params:
        prompt: "string — description of the music"
        music_length_ms: "integer — length in ms (range: 3000-600000; default: chosen from the prompt)"
        force_instrumental: "boolean — guarantee an instrumental track (default: false)"
        composition_plan: "object — section-by-section plan (alternative to prompt)"
        respect_sections_durations: "boolean — enforce composition_plan section durations strictly (default: true)"
        output_format: "enum: mp3_44100_128 (default) | mp3_44100_192 | pcm_44100 | opus_48000_128 | ... (codec_samplerate_bitrate)"

  - id: "fal-ai/ace-step/prompt-to-audio"
    aliases: ["ace-step", "ace step music"]
