        image_size: "string preset or {width,height} — square_hd | square | portrait_4_3 | portrait_16_9 | landscape_4_3 | landscape_16_9 | auto_2K | auto_4K (default: {width: 2048, height: 2048})"
        num_images: "integer — number of separate generations (range: 1-6; default: 1)"
        max_images: "integer — maximum images returned per generation (range: 1-6; default: 1)"
        enable_safety_checker: "boolean — enable the safety checker (default: true)"

  - id: "fal-ai/sam-3/3d-objects"
    aliases: ["sam 3d", "sam-3"]
    category: "image-to-3d"
    description: "Precise 3D reconstruction of objects from real images with accurate geometry and texture."
    notes: "$0.02/gen. Output: GLB + Gaussian Splat (.ply). Good for real object reconstruction. Use a prompt or mask URLs to segment objects in multi-object scenes; textured GLB export bakes textures and UVs."
    input:
      required: ["image_url"]
      batch: null
      params:
        image_url: "string — source image URL or local path"
        prompt: "string — optional text prompt for automatic segmentation"
        mask_urls: "string[] — optional mask URLs for segmentation"
        export_textured_glb: "boolean — export a GLB with baked texture and UVs (default: false)"
        seed: "integer — random seed for reproducibility (default: random)"

  - id: "fal-ai/meshy/v6/text-to-3d"
    aliases: ["meshy", "meshy text", "text-to-3d"]
    category: "text-to-3d"
    description: "Generate realistic, production-ready 3D models from text descriptions."
    notes: "$0.80/gen. Output: GLB + thumbnail. Supports standard, lowpoly, and smart-topology model types. Preview mode is faster and returns untextured geometry; full mode returns a textured model with materials, and raw responses may include GLB, FBX, OBJ, USDZ, STL, and Blend formats."
    input:
      required: ["prompt"]
      batch: null
      params:
        prompt: "string — 3D model description (maximum: 600 characters)"
        mode: "enum: preview | full (default: full)"
        model_type: "enum: standard | lowpoly | smart-topology"
        topology: "enum: quad | triangle (default: triangle)"
        target_polycount: "integer — target polygon count (range: 100-300000; default: 30000)"
        symmetry_mode: "enum: off | auto | on (default: auto)"
        enable_pbr: "boolean — generate PBR maps (default: false)"
        is_a_t_pose: "boolean — generate in an A/T pose (default: false)"
        seed: "integer — random seed for reproducibility (default: random)"

  - id: "fal-ai/meshy/v6/image-to-3d"
    aliases: ["meshy image", "image-to-3d"]
    category: "image-to-3d"
    description: "Generate realistic, production-ready 3D models from images."
    notes: "$0.80/gen. Output: GLB + thumbnail. Supports PBR maps. Raw responses may include GLB, FBX, OBJ, USDZ, STL, and Blend formats; PBR mode generates metallic, roughness, and normal maps."
    input:
      required: ["image_url"]
      batch: null
      params:
        image_url: "string — source image URL or local path"
        topology: "enum: quad | triangle (default: triangle)"
        target_polycount: "integer — target polygon count (range: 100-300000; default: 30000)"
        symmetry_mode: "enum: off | auto | on (default: auto)"
        should_texture: "boolean — generate textures (default: true)"
        enable_pbr: "boolean — generate metallic, roughness, and normal PBR maps (default: false)"
        is_a_t_pose: "boolean — generate in an A/T pose (default: false)"

  - id: "fal-ai/trellis-2"
    aliases: ["trellis", "trellis2"]
    category: "image-to-3d"
    description: "High-quality 3D model generation from images using native 3D generative model."
    notes: "$0.25-0.35/gen based on resolution. Output: GLB. Good for game assets. 500k vertices suits most uses; 20k-50k suits web/mobile, while remeshing gives cleaner topology but is slower."
    input:
      required: ["image_url"]
      batch: null
      params:
        image_url: "string — source image URL or local path"
        resolution: "enum integer: 512 | 1024 | 1536 (default: 1024)"
        texture_size: "enum integer: 1024 | 2048 | 4096 (default: 2048)"
        decimation_target: "integer — target vertex count (range: 5000-2000000; default: 500000)"
        remesh: "boolean — rebuild mesh topology for cleaner topology at greater latency (default: true)"
        seed: "integer — random seed for reproducibility (default: random)"

  - id: "fal-ai/reconviagen-0.5"
    aliases: ["reconviagen", "reconviagen 0.5", "reconvia", "recon"]
    category: "image-to-3d"
    description: "Reconstruct textured 3D GLB models from one or more object images."
    notes: "$0.25-0.35/gen based on resolution. Queue-based. Best with one or more clean object views. Pricing is $0.25 at 512, $0.30 at 1024, and $0.35 at 1536; multi-image strategy applies only when multiple views are supplied."
    input:
      required: ["image_urls"]
      batch: null
      params:
        image_urls: "string[] — one or more source image URLs or local paths showing the same object"
        resolution: "enum integer: 512 | 1024 | 1536 (default: 1024)"
        texture_size: "enum integer: 1024 | 2048 | 4096 (default: 2048)"
        decimation_target: "integer — target vertex count (range: 5000-2000000; default: 500000)"
        ss_source: "enum: direct | mesh | mvtrellis2 (default: mesh)"
        multi_image_strategy: "enum: average_right | weighted_average | sequential | average | adaptive_guidance_weight | fixed_guidance_rescale (default: adaptive_guidance_weight; used only with multiple images)"
        seed: "integer — random seed (range: 0-2147483647; default: random)"

  - id: "fal-ai/birefnet/v2"
    aliases: ["birefnet", "birefnet v2", "background removal", "remove background"]
    category: "image-to-image"
    description: "Remove backgrounds from images using BiRefNet V2. Multiple model variants for different use cases."
    notes: "Models: Light (fast), Heavy (accurate), Portrait, Matting, Dynamic (variable resolution). General Use (Light 2K) is trained at 2K; 2304x2304 operating resolution is only for General Use (Dynamic)."
    input:
      required: ["image_url"]
      batch: null
      params:
        image_url: "string — source image URL or local path"
        model: "enum: General Use (Light) | General Use (Light 2K) | General Use (Heavy) | Matting | Portrait | General Use (Dynamic) (default: General Use (Light))"
        operating_resolution: "enum: 1024x1024 | 2048x2048 | 2304x2304 (default: 1024x1024; 2304x2304 requires General Use (Dynamic))"
        output_mask: "boolean — also return the mask used for background removal (default: false)"
        refine_foreground: "boolean — refine the foreground with the estimated mask (default: true)"
        output_format: "enum: png | webp | gif (default: png)"

  - id: "fal-ai/seedvr/upscale/image"
    aliases: ["seedvr", "seedvr upscale", "upscale", "image upscale"]
    category: "image-to-image"
